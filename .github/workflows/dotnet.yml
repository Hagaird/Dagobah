name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find project files
        run: find . -name "*.sln" -o -name "*.csproj"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore bmi2021/bmi2021.sln

      - name: Build
        run: dotnet build bmi2021/bmi2021.sln --no-restore

      - name: Test
        run: dotnet test bmi2021/bmi2021.sln --no-build --verbosity normal
